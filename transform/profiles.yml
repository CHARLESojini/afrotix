afrotix:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:

    duckdb:
      type: duckdb
      # path is relative to this dbt project dir (transform/)
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse/afrotix.duckdb') }}"
      schema: main
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: analytics
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      threads: 4
